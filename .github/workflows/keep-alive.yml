# Supabase pauses free projects after ~7 days without activity.
# This makes one tiny read every 3 days so that never happens.
# Needs two repository secrets (GitHub → Settings → Secrets and variables → Actions):
#   SUPABASE_URL  and  SUPABASE_KEY  (the same public values as in .env)
name: Keep Supabase awake

on:
  schedule:
    - cron: '17 9 */3 * *'
  workflow_dispatch: # lets you run it by hand from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query one restaurant
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          curl --fail --silent --show-error \
            "$SUPABASE_URL/rest/v1/restaurants?select=id&limit=1" \
            -H "apikey: $SUPABASE_KEY" > /dev/null
          echo "Supabase is awake."
